<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône Deadsand : une main de zombie surgit du sable devant un soleil couchant rouge -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0e0a"/><stop offset="0.55" stop-color="#8a2a12"/><stop offset="1" stop-color="#e8782a"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff6a1a"/></linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d89a58"/><stop offset="1" stop-color="#a8663a"/></linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b070"/><stop offset="1" stop-color="#b8763e"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ac85a"/><stop offset="1" stop-color="#4a6a28"/></linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- soleil rayé -->
    <circle cx="256" cy="236" r="150" fill="url(#sun)"/>
    <g fill="#8a2a12" opacity="0.85">
      <rect x="90" y="262" width="332" height="9"/><rect x="90" y="288" width="332" height="13"/><rect x="90" y="318" width="332" height="17"/><rect x="90" y="352" width="332" height="22"/>
    </g>
    <!-- dune du fond -->
    <path d="M0 360 Q120 318 250 352 T512 330 V512 H0Z" fill="url(#dune1)"/>
    <!-- main de zombie -->
    <g stroke="#14110e" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
      <path d="M214 470 L224 318 L292 318 L304 470 Z" fill="url(#skin)"/>
      <path d="M210 396 L222 372 L236 390 L252 366 L266 388 L282 368 L296 390 L310 380 L314 430 L206 430 Z" fill="#7a1e16"/>
      <rect x="206" y="236" width="112" height="106" rx="34" fill="url(#skin)"/>
      <rect x="208" y="150" width="28" height="112" rx="14" fill="url(#skin)" transform="rotate(-10 222 250)"/>
      <rect x="240" y="122" width="28" height="134" rx="14" fill="url(#skin)" transform="rotate(-3 254 250)"/>
      <rect x="272" y="130" width="28" height="126" rx="14" fill="url(#skin)" transform="rotate(5 286 250)"/>
      <rect x="302" y="168" width="26" height="98" rx="13" fill="url(#skin)" transform="rotate(14 315 255)"/>
      <rect x="150" y="262" width="80" height="28" rx="14" fill="url(#skin)" transform="rotate(-32 222 280)"/>
    </g>
    <!-- griffures et sang sur les doigts -->
    <g fill="#7a1e16"><circle cx="252" cy="140" r="7"/><circle cx="288" cy="146" r="6"/><circle cx="224" cy="168" r="5"/></g>
    <!-- sable au premier plan qui recouvre le bras -->
    <path d="M0 430 Q140 396 260 428 T512 412 V512 H0Z" fill="url(#dune2)" stroke="#14110e" stroke-width="8"/>
    <g fill="#c88a4e"><circle cx="120" cy="470" r="6"/><circle cx="380" cy="460" r="5"/><circle cx="300" cy="490" r="4"/></g>
  </g>
</svg>
