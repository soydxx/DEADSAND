<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14110e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Deadsand">
  <title>Deadsand</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js (moteur 3D) embarqué dans le dossier : le jeu fonctionne hors ligne -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="hud"></canvas>

  <div id="hud-buttons" class="hidden">
    <button id="btn-settings" class="icon-btn" aria-label="Paramètres">⚙️</button>
  </div>
  <button id="btn-roll" class="hidden" aria-label="Roulade">🌀</button>
  <button id="btn-ability" class="hidden" aria-label="Capacité spéciale"><span class="ic">💫</span><span class="k"></span></button>
  <div id="hotbar" class="hidden"></div>
  <div id="ctx-buttons">
    <button id="btn-action" class="ctx-btn hidden"></button>
    <button id="btn-next" class="ctx-btn next hidden"></button>
    <button id="btn-build" class="ctx-btn build hidden"></button>
  </div>
  <div id="buildbar" class="hidden"></div>
  <div id="toast" aria-live="polite"></div>
  <div id="rotate" aria-hidden="true"><div class="phone"></div><p>Tournez votre téléphone</p><small>Deadsand se joue à l'horizontale</small></div>

  <div id="loading">
    <img class="load-logo" src="icons/icon.svg" alt="">
    <h1 class="title">DEAD<span>SAND</span></h1>
    <div class="load-bar"><i></i></div>
    <p class="load-tip" id="load-tip"></p>
  </div>
  <script>
    // astuces de l'écran de chargement (changent toutes les 3,5 s jusqu'au démarrage du jeu)
    (function () {
      var tips = [
        '💡 Votre arme tire toute seule : concentrez-vous sur vos déplacements.',
        '💡 Cliquez (ou touchez) un zombie ou un fût pour le viser en priorité.',
        '💡 Pendant une roulade, vous êtes invincible : traversez la horde !',
        '💡 Un fût rouge au milieu de la horde, c\'est un carnage assuré.',
        '💡 L\'arme secondaire en main, vous courez plus vite.',
        '💡 Les établis 🔧 améliorent votre arme, les refuges vous aident à survivre.',
        '💡 Les pièces de niveau III demandent une arme de niveau 3 : utilisez-la !',
        '💡 Un survivant appelle à l\'aide ? Rejoignez-le : ferraille ou renfort armé.',
        '💡 Plus vous tenez de vagues, plus vous gardez de ferraille à la fin.',
        '💡 Les kamikazes orange explosent au contact : abattez-les de loin.',
        '💡 Le Bélier se sonne s\'il fonce dans un mur : faites-le charger contre un bâtiment.',
        '💡 Vagues spéciales (coureurs, panne, double boss) : prime ×1,5 à la fin.',
        '💡 Défis d\'armes dans l\'onglet Missions : ils débloquent des camouflages.',
        '💡 Au niveau 50, passez prestige : vous gardez tout et gagnez un insigne ⭐.',
        '💡 Réparez la voiture (4 pièces) pour vous évader et débloquer une nouvelle carte.'
      ], el = document.getElementById('load-tip'), i = Math.floor(Math.random() * tips.length);
      function next() { if (!document.getElementById('loading')) return; el.style.opacity = 0; setTimeout(function () { el.textContent = tips[i++ % tips.length]; el.style.opacity = 1; }, 250); setTimeout(next, 3500); }
      next();
    })();
  </script>
  <div id="overlay" class="hidden"></div>
  <div id="safe-probe" aria-hidden="true"></div>

  <!-- Logique du jeu (scripts classiques) -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/world.js"></script>
  <script src="js/save.js"></script>
  <script src="js/cosmetics.js"></script>
  <script src="js/input.js"></script>
  <script src="js/music.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/story.js"></script>
  <script src="js/waves.js"></script>
  <script src="js/allies.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/gunsmith.js"></script>
  <script src="js/fun.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/loadout.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/online.js"></script>
  <script src="js/forts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <!-- Rendu 3D : charge les modèles puis démarre le jeu -->
  <script type="module" src="js/render3d.js"></script>
</body>
</html>
